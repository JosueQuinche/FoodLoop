# FoodLoop · despliegue en Render
#
# Un solo archivo describe las tres piezas: base de datos, backend y
# frontend. Render lo lee al conectar el repositorio y las crea todas.
#
# La ventaja frente a configurarlas a mano es que el despliegue queda
# versionado: si algo se rompe, se ve en el historial qué cambió.

databases:
  - name: foodloop-db
    databaseName: foodloop
    user: foodloop
    plan: free

services:
  # ---------------------------------------------------------------
  # Backend. La primera vez que arranca detecta la base vacía y carga
  # el catálogo solo, así no hace falta abrir una consola remota.
  # ---------------------------------------------------------------
  - type: web
    name: foodloop-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start --workspace=@foodloop/backend
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodloop-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"

  # ---------------------------------------------------------------
  # Frontend. Se compila a archivos estáticos y se sirve desde la CDN
  # de Render, de modo que no se duerme como el backend.
  #
  # VITE_API debe apuntar a la URL pública del backend. Render no
  # resuelve esa referencia sola en sitios estáticos, así que hay que
  # pegarla a mano en el panel tras el primer despliegue.
  # ---------------------------------------------------------------
  - type: web
    name: foodloop-web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build --workspace=@foodloop/frontend
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API
        sync: false
    routes:
      # Una aplicación de una sola página: cualquier ruta devuelve el
      # index y el enrutado lo resuelve el navegador.
      - type: rewrite
        source: /*
        destination: /index.html
